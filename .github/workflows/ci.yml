name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токену workflow нужен только доступ на чтение репозитория: сборка и тесты
# ничего не публикуют. Без явного блока права остаются дефолтными (шире нужного).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Версию pnpm не задаём здесь: она пришпилена полем packageManager в package.json.
      # Ключ allowBuilds в pnpm-workspace.yaml понимает только pnpm 11 — на pnpm 10
      # установка встанет на неодобренном build-скрипте esbuild.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
        # лайв-смоук (tests/live) пропускается без LIVE=1 и кредов — в CI не гоняется

      # Юнит-тесты импортируют исходники, поэтому поломку сборки не видят, — а в npm
      # и в .mcpb уезжает именно dist. Здесь собранные серверы поднимаются как stdio-процессы
      # и опрашиваются настоящим MCP-клиентом. Сети не требует.
      - name: E2E по протоколу (собранные серверы)
        run: pnpm test:e2e

      # Версия дублируется в 42 местах (по 4 на каждый сервер + манифесты плагинов).
      # Расхождение уже приводило к тому, что реестр MCP не получил выпущенную
      # версию, — гейт ловит это до релиза. Точный список печатает сам скрипт.
      - name: Проверка синхронности версий
        run: pnpm version:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Известные уязвимости в зависимостях, которые уезжают внутрь .mcpb-бандлов.
      # Не блокирует сборку: отчёт информационный, решение — за мейнтейнером.
      - name: Аудит зависимостей
        run: pnpm audit --audit-level moderate || true
